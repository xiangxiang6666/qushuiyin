<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>短视频去水印</title>


<style>

body{

margin:0;

background:#f5f5f5;

font-family:
-apple-system,BlinkMacSystemFont;

}


.box{

max-width:450px;

margin:auto;

padding:20px;

}


.card{

background:#fff;

padding:20px;

border-radius:18px;

}


textarea{

width:100%;

height:100px;

padding:10px;

box-sizing:border-box;

border-radius:10px;

}


button{

width:100%;

height:45px;

margin-top:15px;

border:0;

border-radius:25px;

background:#111;

color:#fff;

font-size:16px;

}


img,video{

width:100%;

margin-top:15px;

border-radius:12px;

}


.tip{

color:#888;

font-size:13px;

margin-top:10px;

}


</style>


</head>



<body>


<div class="box">


<h2 align="center">
短视频去水印
</h2>


<div class="card">


<textarea id="input"
placeholder="复制视频分享文字或链接">
</textarea>


<button onclick="parseVideo()">
开始解析
</button>


<div class="tip">
打开页面会自动读取剪贴板
</div>


<div id="result"></div>


</div>


</div>





<script>


const API =
"https://qushuiyin-api.bonto.run";





// 自动读取剪贴板

window.onload=async()=>{


try{


let text=
await navigator.clipboard.readText();


if(text){

document.getElementById("input").value=
extractUrl(text);

}


}catch(e){}



};





// 自动提取链接

function extractUrl(text){


let reg =
/https?:\/\/[^\s]+/g;


let arr =
text.match(reg);


return arr ? arr[0] : text;


}





async function parseVideo(){


let text =
document.getElementById("input").value;


let url =
extractUrl(text);



if(!url){

alert("请输入视频链接");

return;

}



document.getElementById("result").innerHTML=
"正在解析...";



let res =
await fetch(
API+"/api/parse",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

url:url

})

});


let data =
await res.json();



if(!data.success){

document.getElementById("result").innerHTML=
data.message;

return;

}



let video =
API+
"/api/download?url="
+
encodeURIComponent(
data.data.video
);



document.getElementById("result").innerHTML=`

<h3>
${data.data.title || ""}
</h3>


<img src="${data.data.cover}">



<video 
controls
playsinline
src="${video}">
</video>



<a href="${video}" download>

<button>
下载无水印视频
</button>

</a>


`;



}


</script>



</body>

</html>

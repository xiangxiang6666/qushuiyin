<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>短视频去水印</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#f5f5f5;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Arial;

}



.box{

max-width:450px;

margin:auto;

padding:20px;

}



h2{

text-align:center;

}



.card{

background:white;

padding:20px;

border-radius:18px;

}



textarea{

width:100%;

height:110px;

padding:12px;

border:1px solid #ddd;

border-radius:12px;

font-size:15px;

}



.row{

display:flex;

gap:10px;

}



.row button{

flex:1;

}



button{

width:100%;

height:45px;

margin-top:15px;

border:none;

border-radius:25px;

background:#111;

color:white;

font-size:16px;

}



.paste{

background:#1677ff;

}



.clear{

background:#888;

}



.save{

background:#07c160;

}



img,
video{

width:100%;

margin-top:18px;

border-radius:12px;

background:#000;

}



.title{

font-size:17px;

font-weight:bold;

line-height:1.5;

margin-top:15px;

}



.tip{

font-size:13px;

color:#888;

line-height:1.6;

margin-top:12px;

}


.loading{

text-align:center;

padding:20px;

color:#666;

}


</style>

</head>



<body>


<div class="box">


<h2>
短视频去水印
</h2>



<div class="card">


<textarea id="input"

placeholder="复制抖音、快手、小红书分享文字或链接">

</textarea>




<div class="row">

<button class="paste" onclick="pasteText()">

粘贴链接

</button>


<button class="clear" onclick="clearText()">

清空

</button>

</div>




<button onclick="parseVideo()">

开始解析

</button>




<div id="result"></div>



</div>


</div>





<script>


const API =
"https://qushuiyin-api.bonto.run";


let currentVideo="";






// 点击粘贴

async function pasteText(){


try{


const text =
await navigator.clipboard.readText();


if(text){


document.getElementById("input").value =
text;


}else{


alert("剪贴板没有内容");

}


}catch(e){


alert("请允许浏览器读取剪贴板");

}


}






// 清空

function clearText(){


document.getElementById("input").value="";


document.getElementById("result").innerHTML="";


}







// 自动提取链接

function extractUrl(text){


let urls =
text.match(
/https?:\/\/[^\s]+/g
);



return urls ? urls[0] : text;


}








async function parseVideo(){



let text =
document.getElementById("input").value;



let url =
extractUrl(text);



if(!url){

alert("请输入视频链接");

return;

}



document.getElementById("result").innerHTML=

`
<div class="loading">

正在解析...

</div>
`;





try{


let response =
await fetch(

API+"/api/parse",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

url:url

})


}

);






let data =
await response.json();






if(!data.success){


document.getElementById("result").innerHTML=

data.message || "解析失败";


return;


}





currentVideo =

API+

"/api/video?url="+

encodeURIComponent(

data.data.video

);







document.getElementById("result").innerHTML=

`


<div class="title">

${data.data.title || "无标题"}

</div>




<button class="save" onclick="saveVideo()">

保存视频

</button>



<div class="tip">

苹果手机点击后选择「存储视频」<br>

安卓手机自动下载

</div>




<img src="${data.data.cover || ''}">





<video

controls

playsinline

webkit-playsinline

src="${currentVideo}">

</video>



`;





}catch(error){


document.getElementById("result").innerHTML=

"解析失败："+error.message;


}




}








// 保存视频

async function saveVideo(){



try{


const response =
await fetch(currentVideo);



const blob =
await response.blob();




const file =
new File(

[blob],

"无水印视频.mp4",

{

type:"video/mp4"

}

);






// iPhone分享保存

if(

navigator.canShare &&

navigator.canShare({

files:[file]

})

){



await navigator.share({

files:[file],

title:"保存视频"

});



}else{



// 安卓下载


const a =
document.createElement("a");


a.href =
URL.createObjectURL(blob);


a.download =
"无水印视频.mp4";


document.body.appendChild(a);


a.click();


a.remove();


}



}catch(e){


alert(
"保存失败，请稍后重试"
);


}



}




</script>


</body>

</html>

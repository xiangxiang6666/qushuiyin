<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>短视频去水印</title>


<style>

body{

margin:0;

background:#f5f5f5;

font-family:
-apple-system,BlinkMacSystemFont,"Segoe UI";

}


.container{

max-width:450px;

margin:auto;

padding:20px;

}



.card{

background:white;

padding:20px;

border-radius:18px;

}



textarea{

width:100%;

height:100px;

border-radius:12px;

padding:10px;

box-sizing:border-box;

}



button{

width:100%;

height:45px;

margin-top:15px;

border:0;

border-radius:25px;

background:#111;

color:white;

font-size:16px;

}



img,video{

width:100%;

margin-top:15px;

border-radius:12px;

background:#000;

}


.tip{

font-size:13px;

color:#888;

margin-top:15px;

}


</style>

</head>



<body>


<div class="container">


<h2 align="center">
短视频去水印
</h2>



<div class="card">


<textarea id="input"
placeholder="复制抖音/快手/小红书分享文字或链接"></textarea>



<button onclick="parseVideo()">

开始解析

</button>



<div class="tip">

打开网页自动读取剪贴板

</div>



<div id="result"></div>


</div>


</div>






<script>


const API =
"https://qushuiyin-api.bonto.run";




// 自动读取剪贴板

window.onload=async()=>{


try{


let text =
await navigator.clipboard.readText();


if(text){


document.getElementById("input").value =
extractUrl(text);


}


}catch(e){}


};






// 提取链接

function extractUrl(text){


let reg =
/https?:\/\/[^\s]+/g;


let result =
text.match(reg);


return result ? result[0] : text;


}







async function parseVideo(){


let text =
document.getElementById("input").value;


let url =
extractUrl(text);



if(!url){

alert("请输入视频链接");

return;

}



document.getElementById("result").innerHTML =
"正在解析...";





let response =
await fetch(
API+"/api/parse",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

url:url

})


});





let data =
await response.json();





if(!data.success){


document.getElementById("result").innerHTML =
data.message;


return;

}






let title =
data.data.title || "";



let cover =
data.data.cover || "";



let video =

API+
"/api/download?url="+
encodeURIComponent(
data.data.video
);






document.getElementById("result").innerHTML =`



<h3>

${title}

</h3>




<img src="${cover}">





<video

controls

playsinline

webkit-playsinline

src="${video}">

</video>





<a href="${video}" download>

<button>

下载无水印视频

</button>

</a>





<div class="tip">

苹果手机：播放后长按视频保存到照片

</div>


`;



}



</script>



</body>

</html>

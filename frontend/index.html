<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>短视频去水印</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#f5f5f5;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Arial;

}



.box{

max-width:450px;

margin:auto;

padding:20px;

}



h2{

text-align:center;

}



.card{

background:white;

padding:20px;

border-radius:18px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



textarea{

width:100%;

height:100px;

border:1px solid #ddd;

border-radius:12px;

padding:12px;

font-size:15px;

}



button{

width:100%;

height:46px;

margin-top:15px;

border:none;

border-radius:25px;

background:#111;

color:white;

font-size:16px;

}



img{

width:100%;

margin-top:18px;

border-radius:12px;

}



video{

width:100%;

margin-top:18px;

border-radius:12px;

background:#000;

}



.title{

font-size:17px;

font-weight:bold;

line-height:1.5;

margin-top:10px;

}



.tip{

font-size:13px;

color:#888;

margin-top:15px;

line-height:1.6;

}


</style>


</head>



<body>


<div class="box">


<h2>
短视频去水印
</h2>



<div class="card">



<textarea id="input"

placeholder="复制抖音、快手、小红书分享文字或链接">

</textarea>



<button onclick="parseVideo()">

开始解析

</button>



<div id="result"></div>



</div>


</div>






<script>


const API =
"https://qushuiyin-api.bonto.run";



let currentVideo="";






// 自动读取剪贴板

window.onload=async()=>{


try{


let text =
await navigator.clipboard.readText();



if(text){


document.getElementById("input").value =
extractUrl(text);


}



}catch(e){


console.log("剪贴板读取失败");

}


};







// 提取链接

function extractUrl(text){


let arr =
text.match(/https?:\/\/[^\s]+/g);



return arr ? arr[0] : text;


}







async function parseVideo(){


let text =
document.getElementById("input").value;


let url =
extractUrl(text);



if(!url){

alert("请输入视频链接");

return;

}



document.getElementById("result").innerHTML =
"正在解析...";





try{


let res =
await fetch(
API+"/api/parse",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

url:url

})

});





let data =
await res.json();





if(!data.success){


document.getElementById("result").innerHTML =
data.message || "解析失败";


return;


}





currentVideo =

API+
"/api/video?url="+
encodeURIComponent(
data.data.video
);






document.getElementById("result").innerHTML =`



<div class="title">

${data.data.title || "无标题"}

</div>





<button onclick="saveVideo()">

保存视频到手机

</button>




<div class="tip">

苹果手机点击后选择「存储视频」<br>

安卓手机会直接保存

</div>





<img src="${data.data.cover || ''}">





<video

controls

playsinline

webkit-playsinline

src="${currentVideo}">

</video>



`;





}catch(error){


document.getElementById("result").innerHTML =
"解析失败："+error.message;


}



}









async function saveVideo(){



try{


let response =
await fetch(currentVideo);



let blob =
await response.blob();





let file =
new File(

[blob],

"qushuiyin.mp4",

{

type:"video/mp4"

}

);







if(

navigator.canShare &&

navigator.canShare({

files:[file]

})

){


await navigator.share({

files:[file],

title:"保存视频"

});


}else{


let link =
document.createElement("a");


link.href =
URL.createObjectURL(blob);


link.download =
"qushuiyin.mp4";


link.click();


}



}catch(error){


console.log(error);


alert(
"保存失败，请稍后重试"
);


}



}



</script>



</body>

</html>

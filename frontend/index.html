<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>短视频去水印</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#f5f5f5;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Roboto,
Arial;

}


.container{

max-width:450px;

margin:auto;

padding:20px;

}



h1{

text-align:center;

font-size:24px;

}



.card{

background:#fff;

padding:20px;

border-radius:18px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



textarea{

width:100%;

height:110px;

border:1px solid #ddd;

border-radius:12px;

padding:12px;

font-size:15px;

resize:none;

}



button{

width:100%;

height:45px;

margin-top:15px;

border:none;

border-radius:25px;

background:#111;

color:white;

font-size:16px;

}



img{

width:100%;

margin-top:15px;

border-radius:12px;

}



video{

width:100%;

margin-top:15px;

border-radius:12px;

background:#000;

}



.info{

margin-top:15px;

font-size:14px;

color:#555;

}


.tip{

margin-top:15px;

font-size:13px;

color:#888;

}


</style>

</head>



<body>


<div class="container">


<h1>
短视频去水印
</h1>


<div class="card">


<textarea id="input"
placeholder="复制视频链接或分享文字，例如：朋友分享的抖音链接"></textarea>


<button onclick="parseVideo()">
开始解析
</button>


<div class="tip">
打开页面会自动读取剪贴板内容
</div>


<div id="result"></div>


</div>


</div>





<script>


const API =
"https://qushuiyin-api.bonto.run";




// 自动读取剪贴板

window.onload = async()=>{


try{


const text =
await navigator.clipboard.readText();



if(text){


document.getElementById("input").value =
extractUrl(text);


}



}catch(e){


console.log("剪贴板读取失败");

}


};






// 自动提取链接

function extractUrl(text){


const reg =
/https?:\/\/[^\s]+/g;


const result =
text.match(reg);



return result ? result[0] : text;


}







async function parseVideo(){


let text =
document.getElementById("input").value;



let url =
extractUrl(text);



if(!url){


alert("请输入视频链接");

return;

}



document.getElementById("result").innerHTML =
"正在解析...";





try{


let response =
await fetch(
API+"/api/parse",
{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

url:url

})


});




let data =
await response.json();





if(!data.success){


document.getElementById("result").innerHTML =
data.message || "解析失败";


return;


}






let title =
data.data.title || "视频";



let cover =
data.data.cover || "";



let video =
data.data.video || "";





if(!video){


document.getElementById("result").innerHTML =
"没有获取到视频地址";


return;


}







document.getElementById("result").innerHTML = `


<div class="info">

${title}

</div>


<img src="${cover}">



<video

controls

playsinline

webkit-playsinline

src="${video}">

</video>



<a href="${video}" target="_blank">

<button>

打开视频保存

</button>

</a>


<div class="tip">

苹果手机：打开视频后，长按视频 → 存储到照片<br>

安卓手机：点击下载或保存视频

</div>


`;




}catch(error){



document.getElementById("result").innerHTML =
"请求失败："+error.message;



}



}



</script>


</body>

</html>

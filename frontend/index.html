<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>短视频去水印</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#f5f5f5;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial;

}


.box{

max-width:450px;

margin:auto;

padding:20px;

}


.card{

background:#fff;

padding:20px;

border-radius:18px;

}



textarea{

width:100%;

height:100px;

padding:12px;

font-size:15px;

border-radius:12px;

border:1px solid #ddd;

}



.row{

display:flex;

gap:10px;

}



.row button{

flex:1;

}



button{

width:100%;

height:45px;

margin-top:15px;

border:none;

border-radius:25px;

background:#111;

color:#fff;

font-size:16px;

}



.paste{

background:#1677ff;

}



.clear{

background:#888;

}



.save{

background:#07c160;

}



img,
video{

width:100%;

margin-top:18px;

border-radius:12px;

background:#000;

}



.title{

font-size:17px;

font-weight:bold;

line-height:1.5;

margin-top:15px;

}



.tip{

font-size:13px;

color:#888;

margin-top:10px;

line-height:1.5;

}



</style>


</head>


<body>


<div class="box">


<h2 align="center">
短视频去水印
</h2>



<div class="card">



<textarea id="input"

placeholder="复制抖音、快手、小红书分享文字">

</textarea>




<div class="row">


<button class="paste" onclick="pasteText()">

粘贴

</button>



<button class="clear" onclick="clearText()">

清空

</button>


</div>





<button onclick="parseVideo()">

开始解析

</button>





<div id="result"></div>



</div>


</div>






<script>


const API =
"https://qushuiyin-api.bonto.run";


let downloadUrl="";






// 粘贴

async function pasteText(){


try{


let text =
await navigator.clipboard.readText();



document.getElementById("input").value=text;



}catch(e){


alert("请允许读取剪贴板");


}



}






function clearText(){


document.getElementById("input").value="";


document.getElementById("result").innerHTML="";


}







function extractUrl(text){


let arr =
text.match(/https?:\/\/[^\s]+/g);



return arr ? arr[0] : text;


}









async function parseVideo(){



let text =
document.getElementById("input").value;



let url =
extractUrl(text);




if(!url){

alert("请输入视频链接");

return;

}




document.getElementById("result").innerHTML=

"正在解析...";





try{


let res =
await fetch(

API+"/api/parse",

{


method:"POST",


headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

url:url

})

}

);






let data =
await res.json();






if(!data.success){


document.getElementById("result").innerHTML=

data.message || "解析失败";


return;


}






downloadUrl =
API+
"/api/download?url="+
encodeURIComponent(
data.data.video
);





let playUrl =
API+
"/api/video?url="+
encodeURIComponent(
data.data.video
);






document.getElementById("result").innerHTML=`

<div class="title">

${data.data.title || ""}

</div>





<button class="save" onclick="downloadVideo()">

保存视频

</button>




<div class="tip">

安卓手机直接下载<br>

苹果手机打开后长按视频保存

</div>





<img src="${data.data.cover || ''}">





<video

controls

playsinline

webkit-playsinline

src="${playUrl}">

</video>


`;





}catch(e){


document.getElementById("result").innerHTML=

"解析失败："+e.message;


}




}







function downloadVideo(){


window.location.href =
downloadUrl;


}





</script>



</body>

</html>

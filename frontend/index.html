<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>短视频去水印</title>


<style>

body{

margin:0;

background:#f5f5f5;

font-family:-apple-system,BlinkMacSystemFont;

}


.box{

max-width:450px;

margin:auto;

padding:20px;

}


.card{

background:#fff;

padding:20px;

border-radius:18px;

}



textarea{

width:100%;

height:100px;

padding:12px;

border-radius:12px;

}



button{

width:100%;

height:45px;

margin-top:15px;

border:none;

border-radius:25px;

background:#111;

color:white;

font-size:16px;

}



img,video{

width:100%;

margin-top:15px;

border-radius:12px;

background:#000;

}



.tip{

font-size:13px;

color:#888;

margin-top:12px;

}



.title{

font-size:17px;

font-weight:bold;

line-height:1.5;

}



</style>


</head>


<body>


<div class="box">


<h2 align="center">
短视频去水印
</h2>


<div class="card">


<textarea id="input"

placeholder="粘贴抖音、快手、小红书链接">

</textarea>



<button onclick="parseVideo()">

开始解析

</button>



<div id="result"></div>


</div>


</div>





<script>


const API=
"https://qushuiyin-api.bonto.run";


let videoUrl="";




// 自动读取剪贴板

window.onload=async()=>{


try{


let t=
await navigator.clipboard.readText();


if(t){

document.getElementById("input").value=t;

}


}catch(e){}


};





function getUrl(t){

let r=t.match(/https?:\/\/[^\s]+/);

return r?r[0]:t;

}





async function parseVideo(){


let url=
getUrl(
document.getElementById("input").value
);



document.getElementById("result").innerHTML=
"正在解析...";




let res=
await fetch(
API+"/api/parse",
{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

url:url

})

});




let data=
await res.json();



if(!data.success){

document.getElementById("result").innerHTML=
"解析失败";

return;

}




videoUrl=
API+
"/api/video?url="+
encodeURIComponent(
data.data.video
);





document.getElementById("result").innerHTML=`

<div class="title">

${data.data.title||""}

</div>



<button onclick="saveVideo()">

保存视频

</button>



<div class="tip">

苹果手机：点击后选择保存<br>

安卓手机：直接下载

</div>



<img src="${data.data.cover}">



<video

controls

playsinline

webkit-playsinline

src="${videoUrl}">

</video>


`;



}





function saveVideo(){


window.open(
videoUrl,
"_blank"
);


}



</script>


</body>

</html>
